name: Deploy Development

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  pre-deploy-check:
    name: Pre-deploy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-deploy-dev-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-deploy-dev-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check & Build
        run: npm run build

  deploy-web:
    name: Deploy Web (Vercel Preview)
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build --if-present --workspace=packages/types

      - name: Check Vercel secrets
        id: vercel-check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "VERCEL_TOKEN is not set. Skipping Vercel deploy."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Vercel CLI
        if: steps.vercel-check.outputs.configured == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: steps.vercel-check.outputs.configured == 'true'
        working-directory: apps/web
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Link root node_modules for build and deploy
        if: steps.vercel-check.outputs.configured == 'true'
        run: ln -sf "$(pwd)/node_modules" apps/web/node_modules

      - name: Build project artifacts
        if: steps.vercel-check.outputs.configured == 'true'
        working-directory: apps/web
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Ensure pages/404.html exists for Vercel CLI validation
        if: steps.vercel-check.outputs.configured == 'true'
        working-directory: apps/web
        run: |
          mkdir -p .next/server/pages
          if [ ! -f .next/server/pages/404.html ]; then
            NOT_FOUND=$(find .next/server/app -name "*.html" 2>/dev/null | grep -i "not.found\|404" | head -1)
            if [ -n "$NOT_FOUND" ]; then
              cp "$NOT_FOUND" .next/server/pages/404.html
            else
              printf '<!DOCTYPE html><html><head><title>404</title></head><body><h1>404 - Not Found</h1></body></html>' > .next/server/pages/404.html
            fi
          fi

      - name: Deploy to Vercel (Preview)
        if: steps.vercel-check.outputs.configured == 'true'
        id: deploy
        working-directory: apps/web
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment deploy URL on commit
        if: steps.vercel-check.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const sha = context.sha.slice(0, 7);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 **Web デプロイ完了 (development)** (${sha})\n\n${url}`,
            });

  deploy-api:
    name: Deploy API (Render Development)
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: development
    steps:
      - name: Trigger Render deploy hook
        id: trigger
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL_DEV }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL_DEV is not set. Skipping Render deploy."
            exit 0
          fi
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "status=$response" >> $GITHUB_OUTPUT
          if [ "$response" != "200" ] && [ "$response" != "201" ]; then
            echo "Render deploy hook failed with status: $response"
            exit 1
          fi
          echo "Render deploy triggered successfully (HTTP $response)"

      - name: Comment deploy result on commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const sha = context.sha.slice(0, 7);
            const icon = success ? '🚀' : '❌';
            const label = success ? 'API デプロイ完了 (development)' : 'API デプロイ失敗 (development)';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `${icon} **${label}** (${sha})`,
            });

# ────────────────────────────────────────────
# 必要シークレット（GitHub Secrets に登録）
# ────────────────────────────────────────────
# VERCEL_TOKEN              : Vercel > Settings > Tokens で発行
# VERCEL_ORG_ID             : vercel link 後の .vercel/project.json に記載
# VERCEL_PROJECT_ID         : 同上
# RENDER_DEPLOY_HOOK_URL_DEV: Render > Service > Settings > Deploy Hook で発行
