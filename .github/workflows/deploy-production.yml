name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  pre-deploy-check:
    name: Pre-deploy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-deploy-prod-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-deploy-prod-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check & Build
        run: npm run build

  deploy-web:
    name: Deploy Web (Vercel Production)
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build --if-present --workspace=packages/types

      - name: Check Vercel secrets
        id: vercel-check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "VERCEL_TOKEN is not set. Skipping Vercel deploy."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Vercel CLI
        if: steps.vercel-check.outputs.configured == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: steps.vercel-check.outputs.configured == 'true'
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Link root node_modules for build and deploy
        if: steps.vercel-check.outputs.configured == 'true'
        run: rm -rf apps/web/node_modules && ln -sf "$(pwd)/node_modules" apps/web/node_modules

      - name: Build project artifacts
        if: steps.vercel-check.outputs.configured == 'true'
        working-directory: apps/web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prepare Vercel deployment
        if: steps.vercel-check.outputs.configured == 'true'
        run: |
          # Restore 404.html deleted by vercel build post-processing
          # (filePathMap references apps/web/.next/server/pages/404.html)
          mkdir -p apps/web/.next/server/pages
          if [ ! -f apps/web/.next/server/pages/404.html ]; then
            src=$(find apps/web/.vercel/output -name "404.html" -not -path "*/functions/*" 2>/dev/null | head -1)
            if [ -n "$src" ]; then
              cp "$src" apps/web/.next/server/pages/404.html
            else
              echo '<!DOCTYPE html><html><head><title>404</title></head><body>404 Not Found</body></html>' > apps/web/.next/server/pages/404.html
            fi
          fi
          # Move .vercel/output to repo root so vercel deploy (run from repo root) resolves
          # filePathMap refs (apps/web/.next/... and node_modules/...) directly from repo root
          # without going through the absolute node_modules symlink (causes EEXIST on Vercel server)
          rm -rf .vercel/output
          mkdir -p .vercel
          mv apps/web/.vercel/output .vercel/output
          # Remove the absolute node_modules symlink to prevent it from being bundled
          rm -f apps/web/node_modules

      - name: Deploy to Vercel (Production)
        if: steps.vercel-check.outputs.configured == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment deploy URL on commit
        if: steps.vercel-check.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const sha = context.sha.slice(0, 7);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 **Web デプロイ完了 (production)** (${sha})\n\n${url}`,
            });

  deploy-api:
    name: Deploy API (Render Production)
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
    steps:
      - name: Trigger Render deploy hook
        id: trigger
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL_PROD }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL_PROD is not set. Skipping Render deploy."
            exit 0
          fi
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "status=$response" >> $GITHUB_OUTPUT
          if [ "$response" != "200" ] && [ "$response" != "201" ]; then
            echo "Render deploy hook failed with status: $response"
            exit 1
          fi
          echo "Render deploy triggered successfully (HTTP $response)"

      - name: Wait for Render deploy to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD }}
        run: |
          echo "Waiting for Render service to become live..."
          for i in $(seq 1 20); do
            sleep 30
            status=$(curl -s \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['deploy']['status'])" 2>/dev/null || echo "unknown")
            echo "Deploy status: $status (attempt $i/20)"
            if [ "$status" = "live" ]; then
              echo "Deploy completed successfully."
              exit 0
            elif [ "$status" = "deactivated" ] || [ "$status" = "build_failed" ]; then
              echo "Deploy failed with status: $status"
              exit 1
            fi
          done
          echo "Timeout waiting for deploy to complete."
          exit 1

      - name: Comment deploy result on commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const sha = context.sha.slice(0, 7);
            const icon = success ? '🚀' : '❌';
            const label = success ? 'API デプロイ完了 (production)' : 'API デプロイ失敗 (production)';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `${icon} **${label}** (${sha})`,
            });

# ────────────────────────────────────────────
# 必要シークレット（GitHub Secrets に登録）
# ────────────────────────────────────────────
# VERCEL_TOKEN               : Vercel > Settings > Tokens で発行
# VERCEL_ORG_ID              : vercel link 後の .vercel/project.json に記載
# VERCEL_PROJECT_ID          : 同上
# RENDER_DEPLOY_HOOK_URL_PROD: Render > Service > Settings > Deploy Hook で発行
# RENDER_API_KEY             : Render > Account > API Keys で発行
# RENDER_SERVICE_ID_PROD     : Render サービスの ID（srv-xxxxxxxxxx 形式）
